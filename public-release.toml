  ".github/workflows/security.yml",
  ".gitignore",
  ".python-version",
  "CITATION.cff",
  "CHANGELOG.md",
  "CODE_OF_CONDUCT.md",
  "LICENSE",
  "PUBLIC_RELEASE_MANIFEST.json",
  "README.md",
  "SECURITY.md",
  "THIRD_PARTY_NOTICES.md",
  "apps/",
  "docker-compose.yml",
  "docs/",
  "examples/",
  "package.json",
  "packages/",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
