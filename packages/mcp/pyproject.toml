[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "quantsieve-mcp"
version = "0.1.0"
description = "Key-free A-share and US-market data tools over MCP"
authors = [{ name = "RRXXZZYY" }]
keywords = ["quantitative-finance", "research", "backtesting", "market-data"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Investment",
]
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "quantsieve-providers[all]>=0.1.0",
  "mcp>=1.28,<2",
]

[project.scripts]
quantsieve-mcp = "quantsieve_mcp.server:main"

[project.urls]
Homepage = "https://github.com/RRXXZZYY/QuantSieve"
Documentation = "https://github.com/RRXXZZYY/QuantSieve#readme"
Repository = "https://github.com/RRXXZZYY/QuantSieve.git"
Issues = "https://github.com/RRXXZZYY/QuantSieve/issues"

[tool.setuptools.packages.find]
where = ["src"]
