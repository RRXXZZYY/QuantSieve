[tool.pytest.ini_options]
addopts = "-ra --strict-markers -m 'not live'"
testpaths = [
  "apps/api/tests",
  "packages/engine/tests",
  "packages/mcp/tests",
  "packages/monitor/tests",
  "packages/providers/tests",
]
markers = [
  "live: tests that call third-party data services",
]

[tool.coverage.run]
branch = true
source = [
  "quantsieve_api",
  "quantsieve_engine",
  "quantsieve_monitor",
  "quantsieve_providers",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
packages = [
  "quantsieve_api",
  "quantsieve_engine",
  "quantsieve_monitor",
  "quantsieve_providers",
]
mypy_path = [
  "apps/api/src",
  "packages/engine/src",
  "packages/monitor/src",
  "packages/providers/src",
]

[[tool.mypy.overrides]]
module = ["akshare.*", "feedparser.*", "pandas.*", "yfinance.*"]
ignore_missing_imports = true
